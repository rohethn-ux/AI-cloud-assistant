name: Python Application Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn google-generativeai python-dotenv

      - name: Check the app imports correctly (catches syntax/import errors)
        run: |
          python -c "import main; print('main.py imported successfully, no syntax errors')"
